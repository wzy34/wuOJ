openapi: 3.1.0
info:
  title: wuOJ API
  version: 0.1.0
  description: |
    Contract between the wuOJ web app and the judge backend (student core).

    Conventions:
    - **Sessions**: `POST /api/auth/login` sets an HTTP-only session cookie. Requests to protected
      endpoints without a valid session get `401`.
    - **CSRF**: every `POST`/`PUT`/`PATCH`/`DELETE` must send an `X-XSRF-TOKEN` header equal to the
      `XSRF-TOKEN` cookie, otherwise `403`. The server issues the `XSRF-TOKEN` cookie on every
      response to `GET /api/auth/me`, which clients call on startup before any state-changing request.
    - **Errors**: RFC 9457 problem details (`application/problem+json`), see `ApiProblem`.
    - **Paging**: `page` is 1-based (default 1), `size` defaults to 20 and is at most 100.
    - **Hidden data**: inputs and expected outputs of non-sample tests are never returned. Submission
      source code and compiler output are returned only to the submission's owner.
servers:
  - url: /
tags:
  - name: auth
    description: Session handling
  - name: problems
    description: Problem browsing
  - name: submissions
    description: Submitting code and reviewing submissions
security:
  - sessionCookie: []

paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        '204':
          description: Signed out; the session cookie is cleared.
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get the signed-in user
      description: Also issues the `XSRF-TOKEN` cookie, signed in or not.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/problems:
    get:
      tags: [problems]
      operationId: listProblems
      summary: List problems
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          description: Case-insensitive substring match on the title.
          schema:
            type: string
            maxLength: 100
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/Difficulty'
      responses:
        '200':
          description: A page of problems ordered by display id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/problems/{slug}:
    get:
      tags: [problems]
      operationId: getProblem
      summary: Get a problem with its statement and samples
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/submissions:
    get:
      tags: [submissions]
      operationId: listSubmissions
      summary: List submissions, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/SubmissionScope'
        - name: problem
          in: query
          description: Only submissions to the problem with this slug.
          schema:
            type: string
        - name: verdict
          in: query
          schema:
            $ref: '#/components/schemas/Verdict'
      responses:
        '200':
          description: A page of submissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [submissions]
      operationId: createSubmission
      summary: Submit code for judging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        '201':
          description: Submission accepted for judging, initially `PENDING`.
          headers:
            Location:
              description: URL of the new submission.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/submissions/{id}:
    get:
      tags: [submissions]
      operationId: getSubmission
      summary: Get one submission
      description: '`sourceCode` and `compileOutput` are present only for the owner.'
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: The submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/submissions/{id}/events:
    get:
      tags: [submission-events]
      operationId: streamSubmissionEvents
      summary: Live status events for one submission (Server-Sent Events)
      description: |
        Emits an SSE event named `status` whose `data` is a JSON-encoded `SubmissionStatusEvent`.
        The current state is sent immediately on connect, then on every status or progress change.
        The server closes the stream after the event with status `FINISHED`.
        Proxies must not buffer this response.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    SubmissionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: The request is invalid; field errors are listed in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Unauthorized:
      description: No valid session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Forbidden:
      description: Missing or invalid CSRF token, or not allowed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    TooManyRequests:
      description: Too many submissions; retry after the given number of seconds.
      headers:
        Retry-After:
          description: Seconds to wait before submitting again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'

  schemas:
    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    Language:
      type: string
      description: Only C++17 in this version.
      enum: [CPP17]
    UserRole:
      type: string
      enum: [STUDENT, ADMIN]
    ProblemUserStatus:
      type: string
      description: '`SOLVED`: at least one accepted submission. `ATTEMPTED`: submissions but none accepted.'
      enum: [SOLVED, ATTEMPTED, NONE]
    SubmissionScope:
      type: string
      enum: [mine, all]
      default: mine
    SubmissionStatus:
      type: string
      enum: [PENDING, COMPILING, RUNNING, FINISHED]
    Verdict:
      type: string
      description: |
        Final result of a `FINISHED` submission: AC Accepted, WA Wrong Answer, TLE Time Limit Exceeded,
        MLE Memory Limit Exceeded, RE Runtime Error, CE Compilation Error, OLE Output Limit Exceeded,
        SE System Error.
      enum: [AC, WA, TLE, MLE, RE, CE, OLE, SE]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128

    CurrentUser:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UserRef:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string

    ProblemRef:
      type: object
      required: [id, displayId, slug, title]
      properties:
        id:
          type: integer
          format: int64
        displayId:
          type: string
          examples: ['1001']
        slug:
          type: string
          examples: [a-plus-b]
        title:
          type: string
          examples: [A + B]

    ProblemSummary:
      type: object
      required: [id, displayId, slug, title, difficulty, status]
      properties:
        id:
          type: integer
          format: int64
        displayId:
          type: string
        slug:
          type: string
        title:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        status:
          $ref: '#/components/schemas/ProblemUserStatus'

    Sample:
      type: object
      required: [input, output]
      properties:
        input:
          type: string
        output:
          type: string

    Problem:
      type: object
      required:
        [id, displayId, slug, title, difficulty, status, timeLimitMs, memoryLimitMb, statement, samples, languages]
      properties:
        id:
          type: integer
          format: int64
        displayId:
          type: string
        slug:
          type: string
        title:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        status:
          $ref: '#/components/schemas/ProblemUserStatus'
        timeLimitMs:
          type: integer
          format: int32
        memoryLimitMb:
          type: integer
          format: int32
        statement:
          type: string
          description: |
            Markdown (GFM) with inline math `$…$` and display math between `$$` lines
            (`$$`, formula, `$$` on separate lines). Raw HTML is not rendered by clients.
        samples:
          type: array
          items:
            $ref: '#/components/schemas/Sample'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'

    ProblemPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProblemSummary'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    CreateSubmissionRequest:
      type: object
      required: [problemId, language, sourceCode]
      properties:
        problemId:
          type: integer
          format: int64
        language:
          $ref: '#/components/schemas/Language'
        sourceCode:
          type: string
          minLength: 1
          maxLength: 65536
          description: At most 64 KB (65,536 characters); must not be blank.

    TestResult:
      type: object
      required: [testNumber, verdict, timeMs, memoryKb]
      properties:
        testNumber:
          type: integer
          format: int32
        verdict:
          $ref: '#/components/schemas/Verdict'
        timeMs:
          type: integer
          format: int32
        memoryKb:
          type: integer
          format: int32

    SubmissionSummary:
      type: object
      required: [id, user, problem, language, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/UserRef'
        problem:
          $ref: '#/components/schemas/ProblemRef'
        language:
          $ref: '#/components/schemas/Language'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        verdict:
          $ref: '#/components/schemas/Verdict'
        timeMs:
          type: integer
          format: int32
          description: Maximum time over the tests run; present once finished (absent for CE).
        memoryKb:
          type: integer
          format: int32
          description: Maximum memory over the tests run; present once finished (absent for CE).
        createdAt:
          type: string
          format: date-time

    SubmissionDetail:
      type: object
      required: [id, user, problem, language, status, createdAt, testResults]
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/UserRef'
        problem:
          $ref: '#/components/schemas/ProblemRef'
        language:
          $ref: '#/components/schemas/Language'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        verdict:
          $ref: '#/components/schemas/Verdict'
        timeMs:
          type: integer
          format: int32
        memoryKb:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        currentTest:
          type: integer
          format: int32
          description: 1-based number of the test being run; present while `RUNNING`.
        totalTests:
          type: integer
          format: int32
        testResults:
          type: array
          description: Tests run so far, up to and including the first non-accepted one.
          items:
            $ref: '#/components/schemas/TestResult'
        sourceCode:
          type: string
          description: Present only for the owner.
        compileOutput:
          type: string
          description: Compiler output; present only for the owner and only when there is output.

    SubmissionPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionSummary'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    SubmissionStatusEvent:
      type: object
      description: '`data` of each `status` event on `GET /api/submissions/{id}/events`.'
      required: [submissionId, status]
      properties:
        submissionId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        currentTest:
          type: integer
          format: int32
        totalTests:
          type: integer
          format: int32
        verdict:
          $ref: '#/components/schemas/Verdict'
        timeMs:
          type: integer
          format: int32
        memoryKb:
          type: integer
          format: int32

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ApiProblem:
      type: object
      description: RFC 9457 problem details.
      required: [status, title, detail]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
