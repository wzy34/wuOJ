openapi: 3.1.0
info:
  title: wuOJ API
  version: 0.3.0
  description: |
    Contract between the wuOJ web app and the judge backend.

    Roles: visitors (no session), users (role `USER`) and admins (role `ADMIN`).

    Conventions:
    - **Sessions**: `POST /api/auth/login` and `POST /api/auth/register` set an HTTP-only session
      cookie. Operations whose `security` allows `{}` also answer without a session, as for a visitor;
      every other operation needs a valid session and answers `401` without one. Admin operations
      answer `403` to users who are not admins.
    - **Revocation**: disabling an account, resetting its password or changing its role ends its
      sessions immediately; the next request is treated as having no session.
    - **Forced password change**: while `CurrentUser.mustChangePassword` is true, every request with
      that session gets `403` except `GET /api/auth/me`, `GET /api/auth/options`,
      `POST /api/auth/logout` and `POST /api/account/password`.
    - **CSRF**: every `POST`/`PUT`/`PATCH`/`DELETE` must send an `X-XSRF-TOKEN` header equal to the
      `XSRF-TOKEN` cookie, otherwise `403`. The server issues the `XSRF-TOKEN` cookie on every
      response to `GET /api/auth/me`, which clients call on startup before any state-changing request.
    - **Errors**: RFC 9457 problem details (`application/problem+json`), see `ApiProblem`.
    - **Paging**: `page` is 1-based (default 1), `size` defaults to 20 and is at most 100.
    - **Hidden data**: inputs and expected outputs of non-sample tests are returned only by the problem
      administration operations under `/api/admin`, to admins. Submission source code and compiler
      output are returned only to the submission's owner and to admins.
    - **Concurrent edits**: problem updates carry the `revision`, and test saves the `baseVersion`, they
      were based on; a stale one gets `409` and changes nothing.
servers:
  - url: /
tags:
  - name: auth
    description: Session handling
  - name: problems
    description: Problem browsing
  - name: submissions
    description: Submitting code and reviewing submissions
  - name: account
    description: The signed-in user's own account
  - name: users
    description: Public user profiles
  - name: admin
    description: Account and problem administration (admins only)
security:
  - sessionCookie: []

paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid username or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: |
            Too many failed sign-in attempts for this username; retry after the given number of seconds.
            `detail` is a message that can be shown to the user as is.
          headers:
            Retry-After:
              description: Seconds to wait before signing in again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        '204':
          description: Signed out; the session cookie is cleared.
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account and sign in as it
      description: |
        Creates a `USER` account and starts a session for it, like `POST /api/auth/login`. The username
        must not be taken (ignoring case) or reserved. The password must be 8–128 characters, differ
        from the username and not be a commonly used password; violations are field errors.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and signed in; the session cookie is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Missing or invalid CSRF token, or registration is closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/options:
    get:
      tags: [auth]
      operationId: getAuthOptions
      summary: Get the sign-in options, such as whether registration is open
      security: []
      responses:
        '200':
          description: The options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOptions'

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get the signed-in user
      description: Also issues the `XSRF-TOKEN` cookie, signed in or not.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/problems:
    get:
      tags: [problems]
      operationId: listProblems
      summary: List problems
      description: Without a session, only visible problems are listed and every status is `NONE`.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          description: Case-insensitive substring match on the title.
          schema:
            type: string
            maxLength: 100
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/Difficulty'
      responses:
        '200':
          description: A page of problems ordered by display id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/problems/{slug}:
    get:
      tags: [problems]
      operationId: getProblem
      summary: Get a problem with its statement and samples
      description: Without a session, the status is `NONE`.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/submissions:
    get:
      tags: [submissions]
      operationId: listSubmissions
      summary: List submissions, newest first
      description: '`scope=mine` (the default) needs a session; `scope=all` also answers visitors.'
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: scope
          in: query
          schema:
            $ref: '#/components/schemas/SubmissionScope'
        - name: problem
          in: query
          description: Only submissions to the problem with this slug.
          schema:
            type: string
        - name: user
          in: query
          description: Only submissions by the user with this username (ignoring case).
          schema:
            type: string
        - name: verdict
          in: query
          schema:
            $ref: '#/components/schemas/Verdict'
      responses:
        '200':
          description: A page of submissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: '`scope=mine` without a valid session.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [submissions]
      operationId: createSubmission
      summary: Submit code for judging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        '201':
          description: Submission accepted for judging, initially `PENDING`.
          headers:
            Location:
              description: URL of the new submission.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/submissions/{id}:
    get:
      tags: [submissions]
      operationId: getSubmission
      summary: Get one submission
      description: '`sourceCode` and `compileOutput` are present only for the owner and for admins.'
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: The submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/submissions/{id}/events:
    get:
      tags: [submission-events]
      operationId: streamSubmissionEvents
      summary: Live status events for one submission (Server-Sent Events)
      description: |
        Emits an SSE event named `status` whose `data` is a JSON-encoded `SubmissionStatusEvent`.
        The current state is sent immediately on connect, then on every status or progress change.
        The server closes the stream after the event with status `FINISHED`.
        Proxies must not buffer this response.
      parameters:
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/account/password:
    post:
      tags: [account]
      operationId: changePassword
      summary: Change the signed-in user's password
      description: |
        Needs the current password. On success the current session stays signed in and every other
        session of the account ends. A wrong current password counts as a failed sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/users/{username}:
    get:
      tags: [users]
      operationId: getUserProfile
      summary: Get a user's public profile
      description: |
        Only visible problems are counted. Disabled accounts are `404` except for admins.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: username
          in: path
          required: true
          description: Matched ignoring case.
          schema:
            type: string
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      summary: List accounts, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          description: Case-insensitive substring match on the username.
          schema:
            type: string
            maxLength: 64
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: enabled
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users/{id}:
    patch:
      tags: [admin]
      operationId: updateAdminUser
      summary: Change an account's role or enabled state
      description: |
        Any change ends the account's sessions. Admins cannot change their own account (`409`).
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/users/{id}/password-reset:
    post:
      tags: [admin]
      operationId: resetUserPassword
      summary: Give an account a temporary password
      description: |
        The account must choose a new password at its next sign-in, and its sessions end. The temporary
        password is returned only in this response. Admins cannot reset their own password (`409`).
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The temporary password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordReset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/audit:
    get:
      tags: [admin]
      operationId: listAuditEntries
      summary: List admin actions on accounts and problems, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/problems:
    get:
      tags: [admin]
      operationId: listAdminProblems
      summary: List all problems, hidden ones included
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: q
          in: query
          description: Case-insensitive substring match on the title.
          schema:
            type: string
            maxLength: 100
        - name: visible
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: A page of problems ordered by display id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProblemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [admin]
      operationId: createAdminProblem
      summary: Create a problem with its tests
      description: |
        The new problem is always hidden; `problem.visible` is ignored. Every test file in `manifest`
        must be an upload (`keep` is not allowed), and at least one test is required. Each file in
        `files` must be referenced exactly once.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateProblemForm'
      responses:
        '201':
          description: The problem was created.
          headers:
            Location:
              description: URL of the new problem's admin resource.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProblem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/admin/problems/{id}:
    get:
      tags: [admin]
      operationId: getAdminProblem
      summary: Get a problem's editable content
      parameters:
        - $ref: '#/components/parameters/ProblemId'
      responses:
        '200':
          description: The problem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [admin]
      operationId: updateAdminProblem
      summary: Replace a problem's details, statement, visibility and samples
      description: |
        `409` if `revision` is not the current one. A request matching the current content changes
        nothing and keeps the revision.
      parameters:
        - $ref: '#/components/parameters/ProblemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProblemRequest'
      responses:
        '200':
          description: The problem after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProblem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/admin/problems/{id}/tests:
    get:
      tags: [admin]
      operationId: listAdminProblemTests
      summary: List the tests of a problem's current test-data version
      parameters:
        - $ref: '#/components/parameters/ProblemId'
      responses:
        '200':
          description: The current tests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTestSet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [admin]
      operationId: saveAdminProblemTests
      summary: Replace a problem's tests with a new ordered list
      description: |
        Tests are numbered 1..n in `manifest.tests` order. Each input and output is either kept from a
        test of `manifest.baseVersion` or uploaded as the `files` part at the given index; every file
        must be referenced exactly once. `409` if `baseVersion` is not the current version. If the
        result equals the current tests, nothing changes and `changed` is false.
      parameters:
        - $ref: '#/components/parameters/ProblemId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SaveTestsForm'
      responses:
        '200':
          description: The tests now current.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTestSaveResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /api/admin/problems/{id}/tests/{number}/input:
    get:
      tags: [admin]
      operationId: downloadAdminProblemTestInput
      summary: Download a test's input from the current version
      description: Supports a `Range` header (one byte range), answered with `206`.
      parameters:
        - $ref: '#/components/parameters/ProblemId'
        - $ref: '#/components/parameters/TestNumber'
      responses:
        '200':
          $ref: '#/components/responses/TestFile'
        '206':
          $ref: '#/components/responses/TestFilePart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/problems/{id}/tests/{number}/output:
    get:
      tags: [admin]
      operationId: downloadAdminProblemTestOutput
      summary: Download a test's expected output from the current version
      description: Supports a `Range` header (one byte range), answered with `206`.
      parameters:
        - $ref: '#/components/parameters/ProblemId'
        - $ref: '#/components/parameters/TestNumber'
      responses:
        '200':
          $ref: '#/components/responses/TestFile'
        '206':
          $ref: '#/components/responses/TestFilePart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    SubmissionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProblemId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TestNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: The request is invalid; field errors are listed in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Unauthorized:
      description: No valid session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Forbidden:
      description: Missing or invalid CSRF token, not allowed, or the account must change its password first.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Conflict:
      description: |
        The change is not allowed in the resource's current state, or was based on an outdated revision
        or test-data version; `detail` says why.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    TestFile:
      description: The whole file, byte-for-byte, as a download named `<number>.in` or `<number>.out`.
      headers:
        Content-Disposition:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    TestFilePart:
      description: The requested byte range of the file.
      headers:
        Content-Range:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    PayloadTooLarge:
      description: An upload is over a size limit; `detail` names the limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    TooManyRequests:
      description: |
        Too many requests; retry after the given number of seconds. `detail` is a message that can be
        shown to the user as is.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'

  schemas:
    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    Language:
      type: string
      description: Only C++17 in this version.
      enum: [CPP17]
    UserRole:
      type: string
      enum: [USER, ADMIN]
    ProblemUserStatus:
      type: string
      description: '`SOLVED`: at least one accepted submission. `ATTEMPTED`: submissions but none accepted.'
      enum: [SOLVED, ATTEMPTED, NONE]
    SubmissionScope:
      type: string
      enum: [mine, all]
      default: mine
    SubmissionStatus:
      type: string
      enum: [PENDING, COMPILING, RUNNING, FINISHED]
    Verdict:
      type: string
      description: |
        Final result of a `FINISHED` submission: AC Accepted, WA Wrong Answer, TLE Time Limit Exceeded,
        MLE Memory Limit Exceeded, RE Runtime Error, CE Compilation Error, OLE Output Limit Exceeded,
        SE System Error.
      enum: [AC, WA, TLE, MLE, RE, CE, OLE, SE]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
        password:
          type: string
          minLength: 8
          maxLength: 128

    AuthOptions:
      type: object
      required: [registrationEnabled]
      properties:
        registrationEnabled:
          type: boolean

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128

    CurrentUser:
      type: object
      required: [id, username, role, mustChangePassword]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        mustChangePassword:
          type: boolean
          description: An admin reset the password; nothing but changing it is allowed until then.

    UserProfile:
      type: object
      required:
        [id, username, role, joinedAt, solvedCount, attemptedCount, submissionCount, acceptedCount, solved]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        joinedAt:
          type: string
          format: date-time
        solvedCount:
          type: integer
          format: int32
        attemptedCount:
          type: integer
          format: int32
          description: Problems with submissions but none accepted.
        submissionCount:
          type: integer
          format: int64
        acceptedCount:
          type: integer
          format: int64
        solved:
          type: array
          description: Solved problems, most recently first solved first.
          items:
            $ref: '#/components/schemas/ProblemRef'

    AdminUser:
      type: object
      required: [id, username, role, enabled, mustChangePassword, createdAt]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        enabled:
          type: boolean
        mustChangePassword:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          description: Absent if the account never signed in.

    AdminUserPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        enabled:
          type: boolean

    PasswordReset:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string

    AuditAction:
      type: string
      enum: [ROLE_CHANGED, DISABLED, ENABLED, PASSWORD_RESET, PROBLEM_CREATED, PROBLEM_UPDATED, TESTS_UPDATED]

    AuditEntry:
      type: object
      description: Exactly one of `target` (an account) and `problem` is present.
      required: [id, createdAt, actor, action]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/UserRef'
        target:
          $ref: '#/components/schemas/UserRef'
        action:
          $ref: '#/components/schemas/AuditAction'
        fromRole:
          $ref: '#/components/schemas/UserRole'
        toRole:
          $ref: '#/components/schemas/UserRole'
        problem:
          $ref: '#/components/schemas/ProblemRef'
        fromTestCount:
          type: integer
          format: int32
          description: For `TESTS_UPDATED`.
        toTestCount:
          type: integer
          format: int32
          description: For `TESTS_UPDATED`.

    AuditEntryPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    AdminProblemSummary:
      type: object
      required: [id, displayId, slug, title, difficulty, visible, testCount, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        displayId:
          type: string
        slug:
          type: string
        title:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        visible:
          type: boolean
        testCount:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time

    AdminProblemPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminProblemSummary'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    ProblemContent:
      type: object
      description: |
        The editable content of a problem. The server checks the same rules as the problem importer and
        reports every invalid field; display ids and slugs must not be used by another problem.
      required: [displayId, slug, title, difficulty, timeLimitMs, memoryLimitMb, statement, visible, samples]
      properties:
        displayId:
          type: string
          description: 1–32 letters, digits, `-` or `_`.
        slug:
          type: string
          description: At most 64 lowercase letters and digits separated by single hyphens.
        title:
          type: string
          description: Not blank, at most 200 characters.
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        timeLimitMs:
          type: integer
          format: int32
          description: 100–10,000.
        memoryLimitMb:
          type: integer
          format: int32
          description: 16–1,024.
        statement:
          type: string
          description: Markdown, as for `Problem.statement`; not blank.
        visible:
          type: boolean
        samples:
          type: array
          items:
            $ref: '#/components/schemas/Sample'

    AdminProblem:
      type: object
      required: [id, revision, testdataVersion, testCount, updatedAt, content]
      properties:
        id:
          type: integer
          format: int64
        revision:
          type: integer
          format: int32
          description: Increases with every change to the content; send it back with an update.
        testdataVersion:
          type: string
          description: The current test-data version; send it back as `baseVersion` when saving tests.
        testCount:
          type: integer
          format: int32
        updatedAt:
          type: string
          format: date-time
        content:
          $ref: '#/components/schemas/ProblemContent'

    UpdateProblemRequest:
      type: object
      required: [revision, content]
      properties:
        revision:
          type: integer
          format: int32
        content:
          $ref: '#/components/schemas/ProblemContent'

    AdminTest:
      type: object
      required: [number, inputBytes, outputBytes]
      properties:
        number:
          type: integer
          format: int32
        inputBytes:
          type: integer
          format: int64
        outputBytes:
          type: integer
          format: int64

    AdminTestSet:
      type: object
      required: [version, tests]
      properties:
        version:
          type: string
        tests:
          type: array
          items:
            $ref: '#/components/schemas/AdminTest'

    TestFileRef:
      type: object
      description: Exactly one of `keep` (a test number of the base version) and `upload` (an index into `files`).
      minProperties: 1
      maxProperties: 1
      properties:
        keep:
          type: integer
          format: int32
          minimum: 1
        upload:
          type: integer
          format: int32
          minimum: 0

    TestEntry:
      type: object
      required: [input, output]
      properties:
        input:
          $ref: '#/components/schemas/TestFileRef'
        output:
          $ref: '#/components/schemas/TestFileRef'

    TestManifest:
      type: object
      required: [tests]
      properties:
        baseVersion:
          type: string
          description: Required when saving tests; absent when creating a problem.
        tests:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TestEntry'

    CreateProblemForm:
      type: object
      required: [problem, manifest]
      properties:
        problem:
          $ref: '#/components/schemas/ProblemContent'
        manifest:
          $ref: '#/components/schemas/TestManifest'
        files:
          type: array
          items:
            type: string
            format: binary

    SaveTestsForm:
      type: object
      required: [manifest]
      properties:
        manifest:
          $ref: '#/components/schemas/TestManifest'
        files:
          type: array
          items:
            type: string
            format: binary

    AdminTestSaveResult:
      type: object
      required: [changed, testSet]
      properties:
        changed:
          type: boolean
          description: False if the tests were identical to the current ones and nothing changed.
        testSet:
          $ref: '#/components/schemas/AdminTestSet'

    UserRef:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string

    ProblemRef:
      type: object
      required: [id, displayId, slug, title]
      properties:
        id:
          type: integer
          format: int64
        displayId:
          type: string
          examples: ['1001']
        slug:
          type: string
          examples: [a-plus-b]
        title:
          type: string
          examples: [A + B]

    ProblemSummary:
      type: object
      required: [id, displayId, slug, title, difficulty, status]
      properties:
        id:
          type: integer
          format: int64
        displayId:
          type: string
        slug:
          type: string
        title:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        status:
          $ref: '#/components/schemas/ProblemUserStatus'

    Sample:
      type: object
      required: [input, output]
      properties:
        input:
          type: string
        output:
          type: string

    Problem:
      type: object
      required:
        [id, displayId, slug, title, difficulty, status, timeLimitMs, memoryLimitMb, statement, samples, languages]
      properties:
        id:
          type: integer
          format: int64
        displayId:
          type: string
        slug:
          type: string
        title:
          type: string
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        status:
          $ref: '#/components/schemas/ProblemUserStatus'
        timeLimitMs:
          type: integer
          format: int32
        memoryLimitMb:
          type: integer
          format: int32
        statement:
          type: string
          description: |
            Markdown (GFM) with inline math `$…$` and display math between `$$` lines
            (`$$`, formula, `$$` on separate lines). Raw HTML is not rendered by clients.
        samples:
          type: array
          items:
            $ref: '#/components/schemas/Sample'
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'

    ProblemPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProblemSummary'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    CreateSubmissionRequest:
      type: object
      required: [problemId, language, sourceCode]
      properties:
        problemId:
          type: integer
          format: int64
        language:
          $ref: '#/components/schemas/Language'
        sourceCode:
          type: string
          minLength: 1
          maxLength: 65536
          description: At most 64 KB (65,536 characters); must not be blank.

    TestResult:
      type: object
      required: [testNumber, verdict, timeMs, memoryKb]
      properties:
        testNumber:
          type: integer
          format: int32
        verdict:
          $ref: '#/components/schemas/Verdict'
        timeMs:
          type: integer
          format: int32
        memoryKb:
          type: integer
          format: int32

    SubmissionSummary:
      type: object
      required: [id, user, problem, language, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/UserRef'
        problem:
          $ref: '#/components/schemas/ProblemRef'
        language:
          $ref: '#/components/schemas/Language'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        verdict:
          $ref: '#/components/schemas/Verdict'
        timeMs:
          type: integer
          format: int32
          description: Maximum time over the tests run; present once finished (absent for CE).
        memoryKb:
          type: integer
          format: int32
          description: Maximum memory over the tests run; present once finished (absent for CE).
        createdAt:
          type: string
          format: date-time

    SubmissionDetail:
      type: object
      required: [id, user, problem, language, status, createdAt, testResults]
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/UserRef'
        problem:
          $ref: '#/components/schemas/ProblemRef'
        language:
          $ref: '#/components/schemas/Language'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        verdict:
          $ref: '#/components/schemas/Verdict'
        timeMs:
          type: integer
          format: int32
        memoryKb:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        currentTest:
          type: integer
          format: int32
          description: 1-based number of the test being run; present while `RUNNING`.
        totalTests:
          type: integer
          format: int32
        testResults:
          type: array
          description: Tests run so far, up to and including the first non-accepted one.
          items:
            $ref: '#/components/schemas/TestResult'
        sourceCode:
          type: string
          description: Present only for the owner and for admins.
        compileOutput:
          type: string
          description: Compiler output; present only for the owner and for admins, and only when there is output.

    SubmissionPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionSummary'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    SubmissionStatusEvent:
      type: object
      description: '`data` of each `status` event on `GET /api/submissions/{id}/events`.'
      required: [submissionId, status]
      properties:
        submissionId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        currentTest:
          type: integer
          format: int32
        totalTests:
          type: integer
          format: int32
        verdict:
          $ref: '#/components/schemas/Verdict'
        timeMs:
          type: integer
          format: int32
        memoryKb:
          type: integer
          format: int32

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    ApiProblem:
      type: object
      description: RFC 9457 problem details.
      required: [status, title, detail]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
