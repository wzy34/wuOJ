spring:
  application:
    name: wuoj
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Test uploads from the admin problem editor.
      max-file-size: 64MB
      # One whole test set: oj.testdata.max-version-bytes plus room for the JSON parts. Raise both together.
      max-request-size: 520MB
  jackson:
    default-property-inclusion: non_null
  session:
    timeout: 8h
  rabbitmq:
    # Judge jobs count as enqueued only once the broker confirms them; unroutable messages are returned.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  docker:
    compose:
      # Leave the dependencies running between restarts of the application.
      lifecycle-management: start-only
  web:
    error:
      # Errors are rendered as problem details by ApiExceptionHandler, never as Boot's error page.
      whitelabel:
        enabled: false

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # Saving tests sends up to two files for each of at most 1,000 tests, plus the JSON parts.
    max-part-count: 2010
    # The JSON parts of a multipart upload (statement, samples, manifest) count against this.
    max-http-form-post-size: 8MB
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always

oj:
  roles: [api, worker]
  testdata:
    root: ./var/testdata
    max-version-bytes: 512MB
  judge:
    image: wuoj/judge-cpp:dev
    work-dir: ./var/judge
    slots: [""]
    simulated: false
    simulated-step: 350ms
  rate-limit:
    submissions: 3
    window: 10s
    unfinished: 2
    unfinished-retry-after: 5s
    submissions-per-address: 30
    address-window: 1m
  login-throttle:
    max-failures: 5
    max-failures-per-address: 50
    window: 5m
  registration:
    enabled: true
    per-address: 5
    window: 1h

logging:
  level:
    # Image pull progress is logged line by line at INFO.
    org.springframework.boot.docker.compose.core.DockerCli: warn
    # Lettuce (Redis) warns on macOS about a native DNS resolver it falls back from; harmless.
    io.netty.resolver.dns.DnsServerAddressStreamProviders: error
