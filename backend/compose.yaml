# Development dependencies. `./gradlew bootRun` starts them through Spring Boot's Docker Compose support.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: wuoj
      POSTGRES_USER: wuoj
      POSTGRES_PASSWORD: wuoj
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wuoj -d wuoj"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: wuoj
      RABBITMQ_DEFAULT_PASS: wuoj
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  rabbitmq-data:
